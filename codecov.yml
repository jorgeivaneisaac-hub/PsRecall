codecov:
  require_ci_to_pass: true
  max_report_age: off
  bot_comment:
    behavior: default
    layout: diff, flags, files
    hide_if_no_changes: false

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 1%
        base: auto
        if_not_found: success
        informational: false
    patch:
      default:
        target: 85%
        threshold: 0%
        base: auto
        if_not_found: success
        informational: false

comment:
  layout: "header, diff, files, footer"
  behavior: "default"
  require_changes: false

ignore:
  - "tests/"
  - "build/"
  - "bin/"
  - "vcpkg_installed/"
